# Svoboden's Themes: Modern Warfare 2 theme for eza (https://eza.rocks).
# Generated by extras/make-extras.mjs from themes/modern-warfare-2.json; change those, not this file.
# Use: save as theme.yml in a folder and set EZA_CONFIG_DIR to it, or put it in eza's default folder
# (~/.config/eza on Linux, ~/Library/Application Support/eza on macOS). LS_COLORS and EZA_COLORS override it.
filekinds:
  normal: {foreground: "#dfdddc"}
  directory: {foreground: "#98d538", is_bold: true}
  symlink: {foreground: "#2d9485"}
  pipe: {foreground: "#dcad00"}
  block_device: {foreground: "#dcad00", is_bold: true}
  char_device: {foreground: "#dcad00"}
  socket: {foreground: "#9d7fb0"}
  special: {foreground: "#9d7fb0"}
  executable: {foreground: "#7bad35", is_bold: true}
  mount_point: {foreground: "#5b86b0", is_underline: true}
perms:
  user_read: {foreground: "#dcad00", is_bold: true}
  user_write: {foreground: "#d9534f", is_bold: true}
  user_execute_file: {foreground: "#7bad35", is_bold: true}
  user_execute_other: {foreground: "#7bad35", is_bold: true}
  group_read: {foreground: "#dcad00"}
  group_write: {foreground: "#d9534f"}
  group_execute: {foreground: "#7bad35"}
  other_read: {foreground: "#dcad00"}
  other_write: {foreground: "#d9534f"}
  other_execute: {foreground: "#7bad35"}
  special_user_file: {foreground: "#9d7fb0"}
  special_other: {foreground: "#9d7fb0"}
  attribute: {foreground: "#5c5a52"}
size:
  major: {foreground: "#2d9485"}
  minor: {foreground: "#2d9485"}
  number_byte: {foreground: "#dfdddc"}
  number_kilo: {foreground: "#dfdddc"}
  number_mega: {foreground: "#dcad00"}
  number_giga: {foreground: "#f0c94a"}
  number_huge: {foreground: "#d9534f"}
  unit_byte: {foreground: "#5c5a52"}
  unit_kilo: {foreground: "#5c5a52"}
  unit_mega: {foreground: "#5c5a52"}
  unit_giga: {foreground: "#5c5a52"}
  unit_huge: {foreground: "#5c5a52"}
users:
  user_you: {foreground: "#dcad00"}
  user_root: {foreground: "#d9534f", is_bold: true}
  user_other: {foreground: "#dfdddc"}
  group_yours: {foreground: "#b6ae85"}
  group_other: {foreground: "#5c5a52"}
  group_root: {foreground: "#d9534f"}
links:
  normal: {foreground: "#2d9485"}
  multi_link_file: {foreground: "#9d7fb0"}
git:
  new: {foreground: "#7bad35"}
  modified: {foreground: "#dcad00"}
  deleted: {foreground: "#d9534f"}
  renamed: {foreground: "#2d9485"}
  typechange: {foreground: "#9d7fb0"}
  ignored: {foreground: "#5c5a52"}
  conflicted: {foreground: "#ff6b5e", is_bold: true}
git_repo:
  branch_main: {foreground: "#7bad35"}
  branch_other: {foreground: "#dcad00"}
  git_clean: {foreground: "#7bad35"}
  git_dirty: {foreground: "#d9534f"}
file_type:
  image: {foreground: "#9d7fb0"}
  video: {foreground: "#c4a6d8"}
  music: {foreground: "#5b86b0"}
  lossless: {foreground: "#8fb3d9"}
  crypto: {foreground: "#bafeba"}
  document: {foreground: "#b6ae85"}
  compressed: {foreground: "#d9534f"}
  temp: {foreground: "#5c5a52"}
  compiled: {foreground: "#5c5a52"}
  build: {foreground: "#98d538", is_underline: true}
  source: {foreground: "#f0c94a"}
punctuation: {foreground: "#5c5a52"}
date: {foreground: "#b6ae85"}
inode: {foreground: "#5c5a52"}
blocks: {foreground: "#5c5a52"}
header: {foreground: "#98d538", is_bold: true, is_underline: true}
octal: {foreground: "#9d7fb0"}
flags: {foreground: "#9d7fb0"}
symlink_path: {foreground: "#2d9485"}
control_char: {foreground: "#d9534f"}
broken_symlink: {foreground: "#d9534f"}
broken_path_overlay: {foreground: "#d9534f", is_underline: true}
