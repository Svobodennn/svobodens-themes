# Svoboden's Themes: Modern Warfare 2 prompt for Starship (https://starship.rs).
# Generated by extras/make-extras.mjs from themes/modern-warfare-2.json; change those, not this file.
# Use: STARSHIP_CONFIG=/path/to/extras/modern-warfare-2/starship.toml, or copy it to ~/.config/starship.toml.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'svoboden_modern_warfare_2'
add_newline = true
continuation_prompt = '[> ](steel)'
format = '[\[OP SVOBODEN\]](bold amber) $directory$git_branch$git_status$cmd_duration$character'

[palettes.svoboden_modern_warfare_2]
lime = '#98d538'
amber = '#dcad00'
khaki = '#b6ae85'
steel = '#5c5a52'
alarm = '#d9534f'

[directory]
truncation_length = 3
truncation_symbol = '../'
home_symbol = '~'
read_only = ' RO'
style = 'bold lime'
read_only_style = 'alarm'
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ''
truncation_symbol = '..'
style = 'amber'
format = '[OBJ ](steel)[$branch]($style) '

[git_status]
ahead = '^${count}'
behind = 'v${count}'
diverged = '^${ahead_count}v${behind_count}'
conflicted = '='
deleted = 'x'
renamed = 'r'
modified = '!'
staged = '+'
untracked = '?'
stashed = '\$'
style = 'alarm'
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = 'khaki'
format = '[T+$duration]($style) '

[line_break]
disabled = false

[character]
success_symbol = '[▸](bold lime)'
error_symbol = '[▸](bold alarm)'
vimcmd_symbol = '[<](bold amber)'
vimcmd_visual_symbol = '[<](bold khaki)'
vimcmd_replace_symbol = '[<](bold alarm)'
vimcmd_replace_one_symbol = '[<](bold alarm)'
