# Svoboden's Themes: Matrix theme for eza (https://eza.rocks).
# Generated by extras/make-extras.mjs from themes/matrix.json; change those, not this file.
# Use: save as theme.yml in a folder and set EZA_CONFIG_DIR to it, or put it in eza's default folder
# (~/.config/eza on Linux, ~/Library/Application Support/eza on macOS). LS_COLORS and EZA_COLORS override it.
filekinds:
  normal: {foreground: "#89f76e"}
  directory: {foreground: "#c1ff75", is_bold: true}
  symlink: {foreground: "#3fd9c8"}
  pipe: {foreground: "#cccc00"}
  block_device: {foreground: "#cccc00", is_bold: true}
  char_device: {foreground: "#cccc00"}
  socket: {foreground: "#9a7ce0"}
  special: {foreground: "#9a7ce0"}
  executable: {foreground: "#00cc00", is_bold: true}
  mount_point: {foreground: "#4a8fe0", is_underline: true}
perms:
  user_read: {foreground: "#cccc00", is_bold: true}
  user_write: {foreground: "#d23c32", is_bold: true}
  user_execute_file: {foreground: "#00cc00", is_bold: true}
  user_execute_other: {foreground: "#00cc00", is_bold: true}
  group_read: {foreground: "#cccc00"}
  group_write: {foreground: "#d23c32"}
  group_execute: {foreground: "#00cc00"}
  other_read: {foreground: "#cccc00"}
  other_write: {foreground: "#d23c32"}
  other_execute: {foreground: "#00cc00"}
  special_user_file: {foreground: "#9a7ce0"}
  special_other: {foreground: "#9a7ce0"}
  attribute: {foreground: "#2f6b35"}
size:
  major: {foreground: "#3fd9c8"}
  minor: {foreground: "#3fd9c8"}
  number_byte: {foreground: "#89f76e"}
  number_kilo: {foreground: "#89f76e"}
  number_mega: {foreground: "#cccc00"}
  number_giga: {foreground: "#eeee55"}
  number_huge: {foreground: "#d23c32"}
  unit_byte: {foreground: "#2f6b35"}
  unit_kilo: {foreground: "#2f6b35"}
  unit_mega: {foreground: "#2f6b35"}
  unit_giga: {foreground: "#2f6b35"}
  unit_huge: {foreground: "#2f6b35"}
users:
  user_you: {foreground: "#c1ff75"}
  user_root: {foreground: "#d23c32", is_bold: true}
  user_other: {foreground: "#89f76e"}
  group_yours: {foreground: "#bbffbb"}
  group_other: {foreground: "#2f6b35"}
  group_root: {foreground: "#d23c32"}
links:
  normal: {foreground: "#3fd9c8"}
  multi_link_file: {foreground: "#9a7ce0"}
git:
  new: {foreground: "#00cc00"}
  modified: {foreground: "#cccc00"}
  deleted: {foreground: "#d23c32"}
  renamed: {foreground: "#3fd9c8"}
  typechange: {foreground: "#9a7ce0"}
  ignored: {foreground: "#2f6b35"}
  conflicted: {foreground: "#ff5a4e", is_bold: true}
git_repo:
  branch_main: {foreground: "#00cc00"}
  branch_other: {foreground: "#cccc00"}
  git_clean: {foreground: "#00cc00"}
  git_dirty: {foreground: "#d23c32"}
file_type:
  image: {foreground: "#9a7ce0"}
  video: {foreground: "#b9a4ff"}
  music: {foreground: "#4a8fe0"}
  lossless: {foreground: "#7fb2ff"}
  crypto: {foreground: "#88ff88"}
  document: {foreground: "#bbffbb"}
  compressed: {foreground: "#d23c32"}
  temp: {foreground: "#2f6b35"}
  compiled: {foreground: "#2f6b35"}
  build: {foreground: "#c1ff75", is_underline: true}
  source: {foreground: "#eeee55"}
punctuation: {foreground: "#2f6b35"}
date: {foreground: "#00cc00"}
inode: {foreground: "#2f6b35"}
blocks: {foreground: "#2f6b35"}
header: {foreground: "#c1ff75", is_bold: true, is_underline: true}
octal: {foreground: "#9a7ce0"}
flags: {foreground: "#9a7ce0"}
symlink_path: {foreground: "#3fd9c8"}
control_char: {foreground: "#d23c32"}
broken_symlink: {foreground: "#d23c32"}
broken_path_overlay: {foreground: "#d23c32", is_underline: true}
