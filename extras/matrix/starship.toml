# Svoboden's Themes: Matrix prompt for Starship (https://starship.rs).
# Generated by extras/make-extras.mjs from themes/matrix.json; change those, not this file.
# Use: STARSHIP_CONFIG=/path/to/extras/matrix/starship.toml, or copy it to ~/.config/starship.toml.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'svoboden_matrix'
add_newline = true
continuation_prompt = '[:: ](trail)'
format = '$directory$git_branch$git_status$cmd_duration$character'

[palettes.svoboden_matrix]
phosphor = '#89f76e'
drop_head = '#c1ff75'
glow = '#88ff88'
code = '#00cc00'
trail = '#2f6b35'
alarm = '#d23c32'

[directory]
truncation_length = 3
truncation_symbol = '../'
home_symbol = '~'
read_only = ' RO'
style = 'bold phosphor'
read_only_style = 'alarm'
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ''
truncation_symbol = '..'
style = 'code'
format = '[::](trail) [$branch]($style) '

[git_status]
ahead = '^${count}'
behind = 'v${count}'
diverged = '^${ahead_count}v${behind_count}'
conflicted = '='
deleted = 'x'
renamed = 'r'
modified = '!'
staged = '+'
untracked = '?'
stashed = '\$'
style = 'glow'
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
style = 'trail'
format = '[$duration]($style) '

[line_break]
disabled = false

[character]
success_symbol = '[▋](bold drop_head)'
error_symbol = '[▋](bold alarm)'
vimcmd_symbol = '[▋](glow)'
vimcmd_visual_symbol = '[▋](code)'
vimcmd_replace_symbol = '[▋](alarm)'
vimcmd_replace_one_symbol = '[▋](alarm)'
