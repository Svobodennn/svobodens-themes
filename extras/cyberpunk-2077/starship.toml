# Svoboden's Themes: Cyberpunk 2077 prompt for Starship (https://starship.rs).
# Generated by extras/make-extras.mjs from themes/cyberpunk-2077.json; change those, not this file.
# Use: STARSHIP_CONFIG=/path/to/extras/cyberpunk-2077/starship.toml, or copy it to ~/.config/starship.toml.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'svoboden_cyberpunk_2077'
add_newline = true
continuation_prompt = '[ :: ](fg:shade)'
format = '[ LOC ](fg:ink bg:hud_yellow)$directory[╱ ](bold fg:hud_yellow)([ GIT ](fg:ink bg:hud_cyan)$git_branch$git_status[╱ ](bold fg:hud_cyan))$cmd_duration$line_break$character'

[palettes.svoboden_cyberpunk_2077]
hud_yellow = '#fcee0a'
hud_cyan = '#00f0ff'
hud_red = '#fe1038'
ink = '#0e0e17'
shade = '#55557a'

[directory]
truncation_length = 3
truncation_symbol = '../'
home_symbol = '~'
read_only = ' RO'
style = 'bold fg:ink bg:hud_yellow'
read_only_style = 'bold fg:hud_red bg:hud_yellow'
format = '[$path]($style)[$read_only]($read_only_style)[ ](bg:hud_yellow)'

[git_branch]
symbol = ''
truncation_symbol = '..'
style = 'bold fg:ink bg:hud_cyan'
format = '[$branch]($style)[ ](bg:hud_cyan)'

[git_status]
ahead = '^${count}'
behind = 'v${count}'
diverged = '^${ahead_count}v${behind_count}'
conflicted = '='
deleted = 'x'
renamed = 'r'
modified = '!'
staged = '+'
untracked = '?'
stashed = '\$'
style = 'fg:ink bg:hud_cyan'
format = '([$all_status$ahead_behind ]($style))'

[cmd_duration]
min_time = 2000
style = 'bold fg:hud_red'
format = '[T+$duration ]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[└─](fg:shade)[>](bold fg:hud_yellow)'
error_symbol = '[└─](fg:shade)[>](bold fg:hud_red)'
vimcmd_symbol = '[└─](fg:shade)[<](bold fg:hud_cyan)'
vimcmd_visual_symbol = '[└─](fg:shade)[<](bold fg:hud_yellow)'
vimcmd_replace_symbol = '[└─](fg:shade)[<](bold fg:hud_red)'
vimcmd_replace_one_symbol = '[└─](fg:shade)[<](bold fg:hud_red)'
