# Svoboden's Themes: Cyberpunk 2077 theme for eza (https://eza.rocks).
# Generated by extras/make-extras.mjs from themes/cyberpunk-2077.json; change those, not this file.
# Use: save as theme.yml in a folder and set EZA_CONFIG_DIR to it, or put it in eza's default folder
# (~/.config/eza on Linux, ~/Library/Application Support/eza on macOS). LS_COLORS and EZA_COLORS override it.
filekinds:
  normal: {foreground: "#c6f6f8"}
  directory: {foreground: "#00f0ff", is_bold: true}
  symlink: {foreground: "#00f0ff"}
  pipe: {foreground: "#fcee0a"}
  block_device: {foreground: "#fcee0a", is_bold: true}
  char_device: {foreground: "#fcee0a"}
  socket: {foreground: "#a24df6"}
  special: {foreground: "#a24df6"}
  executable: {foreground: "#1ded83", is_bold: true}
  mount_point: {foreground: "#00f0ff", is_underline: true}
perms:
  user_read: {foreground: "#fcee0a", is_bold: true}
  user_write: {foreground: "#fe1038", is_bold: true}
  user_execute_file: {foreground: "#1ded83", is_bold: true}
  user_execute_other: {foreground: "#1ded83", is_bold: true}
  group_read: {foreground: "#fcee0a"}
  group_write: {foreground: "#fe1038"}
  group_execute: {foreground: "#1ded83"}
  other_read: {foreground: "#fcee0a"}
  other_write: {foreground: "#fe1038"}
  other_execute: {foreground: "#1ded83"}
  special_user_file: {foreground: "#a24df6"}
  special_other: {foreground: "#a24df6"}
  attribute: {foreground: "#55557a"}
size:
  major: {foreground: "#00f0ff"}
  minor: {foreground: "#00f0ff"}
  number_byte: {foreground: "#c6f6f8"}
  number_kilo: {foreground: "#c6f6f8"}
  number_mega: {foreground: "#fcee0a"}
  number_giga: {foreground: "#ffd741"}
  number_huge: {foreground: "#fe1038"}
  unit_byte: {foreground: "#55557a"}
  unit_kilo: {foreground: "#55557a"}
  unit_mega: {foreground: "#55557a"}
  unit_giga: {foreground: "#55557a"}
  unit_huge: {foreground: "#55557a"}
users:
  user_you: {foreground: "#fcee0a"}
  user_root: {foreground: "#fe1038", is_bold: true}
  user_other: {foreground: "#c6f6f8"}
  group_yours: {foreground: "#c0c8cf"}
  group_other: {foreground: "#55557a"}
  group_root: {foreground: "#fe1038"}
links:
  normal: {foreground: "#00f0ff"}
  multi_link_file: {foreground: "#a24df6"}
git:
  new: {foreground: "#1ded83"}
  modified: {foreground: "#fcee0a"}
  deleted: {foreground: "#fe1038"}
  renamed: {foreground: "#00f0ff"}
  typechange: {foreground: "#a24df6"}
  ignored: {foreground: "#55557a"}
  conflicted: {foreground: "#ff6159", is_bold: true}
git_repo:
  branch_main: {foreground: "#1ded83"}
  branch_other: {foreground: "#fcee0a"}
  git_clean: {foreground: "#1ded83"}
  git_dirty: {foreground: "#fe1038"}
file_type:
  image: {foreground: "#a24df6"}
  video: {foreground: "#c084ff"}
  music: {foreground: "#4f88d5"}
  lossless: {foreground: "#64a1ff"}
  crypto: {foreground: "#dfff5e"}
  document: {foreground: "#c0c8cf"}
  compressed: {foreground: "#fe1038"}
  temp: {foreground: "#55557a"}
  compiled: {foreground: "#55557a"}
  build: {foreground: "#fcee0a", is_underline: true}
  source: {foreground: "#ffd741"}
punctuation: {foreground: "#55557a"}
date: {foreground: "#00f0ff"}
inode: {foreground: "#55557a"}
blocks: {foreground: "#55557a"}
header: {foreground: "#fcee0a", is_bold: true, is_underline: true}
octal: {foreground: "#a24df6"}
flags: {foreground: "#a24df6"}
symlink_path: {foreground: "#00f0ff"}
control_char: {foreground: "#fe1038"}
broken_symlink: {foreground: "#fe1038"}
broken_path_overlay: {foreground: "#fe1038", is_underline: true}
